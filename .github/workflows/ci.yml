name: CI

on:
  push:
    # Só a main: push de tag (v*) não dispara o CI — o release.yml já cuida do
    # release. Antes, toda tag rodava o CI de novo (duplicava o job).
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Os testes primeiro: se a cripto/TOTP/model quebrou, não interessa se o APK sai.
      # Os testes JVM validam o port contra o fixture .tkeys gerado no desktop.
      - name: Testes unitários
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Smoke real: abre o app num emulador Android e confirma que a UI sobe.
  # O ci.yml antigo não pegava crash de startup (ex.: o Application inexistente
  # no manifest que matou a v0.1.0) — só compilar/rodar o app expõe isso.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Smoke test (emulador Android)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest --console=plain
