name: Gen keystore

# TEMPORÁRIO: gera a keystore de assinatura com keytool no runner (Hades não tem
# JDK). Baixar o artifact e APAGAR este workflow. KS_GEN_PW é um secret
# temporário no formato "storepass|keypass|alias" (a keypass vira = storepass,
# pois PKCS12 do keytool exige senhas iguais).
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gerar keystore
        env:
          KS_GEN_PW: ${{ secrets.KS_GEN_PW }}
        run: |
          if [ -z "$KS_GEN_PW" ]; then
            echo "::error::Falta o secret temporário KS_GEN_PW."
            exit 1
          fi
          IFS='|' read -r SPW KPW ALIAS <<< "$KS_GEN_PW"
          keytool -genkeypair -keystore localkeys-android-release.jks -storetype PKCS12 \
            -storepass "$SPW" -keypass "$KPW" -alias "$ALIAS" -keyalg RSA -keysize 2048 \
            -validity 10950 -dname "CN=LocalKeys Android, OU=LocalKeys, O=LocalKeys" -noprompt

      - name: Upload da keystore
        uses: actions/upload-artifact@v6
        with:
          name: localkeys-jks
          path: localkeys-android-release.jks
          if-no-files-found: error
